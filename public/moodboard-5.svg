<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- Moodboard: Garden & Flowers  lush garden scene, couple among blooms -->
  <defs>
    <linearGradient id="mb5bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#mb5bg)"/>
  <!-- Garden arch -->
  <path d="M200 600 Q200 250 400 200 Q600 250 600 600" stroke="#9b1b30" stroke-width="8" fill="none" opacity="0.2"/>
  <!-- Vines on arch -->
  <circle cx="220" cy="380" r="18" fill="#f4a6b1" opacity="0.3"/>
  <circle cx="240" cy="320" r="14" fill="#dc143c" opacity="0.2"/>
  <circle cx="210" cy="450" r="16" fill="#f7c5cc" opacity="0.35"/>
  <circle cx="580" cy="370" r="18" fill="#dc143c" opacity="0.2"/>
  <circle cx="560" cy="310" r="15" fill="#f7c5cc" opacity="0.3"/>
  <circle cx="590" cy="440" r="14" fill="#f4a6b1" opacity="0.3"/>
  <circle cx="230" cy="280" r="12" fill="#ffd7cc" opacity="0.3"/>
  <circle cx="570" cy="270" r="12" fill="#ffd7cc" opacity="0.25"/>
  <!-- Top of arch flowers -->
  <circle cx="350" cy="220" r="16" fill="#dc143c" opacity="0.25"/>
  <circle cx="400" cy="205" r="20" fill="#f7c5cc" opacity="0.35"/>
  <circle cx="450" cy="220" r="16" fill="#f4a6b1" opacity="0.3"/>
  <!-- Ground garden -->
  <path d="M0 700 Q200 670 400 700 Q600 730 800 690 L800 900 L0 900Z" fill="#f7c5cc" opacity="0.2"/>
  <!-- Flower stems and blooms (ground level) -->
  <line x1="120" y1="700" x2="120" y2="600" stroke="#9b1b30" stroke-width="2" opacity="0.2"/>
  <circle cx="120" cy="590" r="14" fill="#dc143c" opacity="0.25"/>
  <line x1="680" y1="690" x2="680" y2="590" stroke="#9b1b30" stroke-width="2" opacity="0.2"/>
  <circle cx="680" cy="580" r="16" fill="#f4a6b1" opacity="0.3"/>
  <line x1="80" y1="710" x2="75" y2="630" stroke="#9b1b30" stroke-width="2" opacity="0.15"/>
  <circle cx="75" cy="620" r="12" fill="#f7c5cc" opacity="0.3"/>
  <line x1="720" y1="700" x2="725" y2="620" stroke="#9b1b30" stroke-width="2" opacity="0.15"/>
  <circle cx="725" cy="610" r="11" fill="#dc143c" opacity="0.2"/>
  <!-- Path through garden -->
  <path d="M350 900 Q380 780 400 740 Q420 700 450 700" stroke="#eab8b2" stroke-width="20" fill="none" opacity="0.15" stroke-linecap="round"/>
  <!-- Two silhouettes under the arch -->
  <g transform="translate(370, 550)">
    <circle cx="0" cy="0" r="14" fill="#9b1b30" opacity="0.45"/>
    <rect x="-10" y="14" width="20" height="40" rx="8" fill="#9b1b30" opacity="0.4"/>
  </g>
  <g transform="translate(430, 545)">
    <circle cx="0" cy="0" r="13" fill="#dc143c" opacity="0.4"/>
    <rect x="-10" y="13" width="20" height="42" rx="8" fill="#dc143c" opacity="0.35"/>
  </g>
  <!-- Butterfly -->
  <g transform="translate(500, 350) scale(0.5)">
    <ellipse cx="-12" cy="0" rx="14" ry="8" fill="#dc143c" opacity="0.35" transform="rotate(-20)"/>
    <ellipse cx="12" cy="0" rx="14" ry="8" fill="#f7c5cc" opacity="0.4" transform="rotate(20)"/>
    <rect x="-1" y="-8" width="2" height="16" fill="#9b1b30" opacity="0.3"/>
  </g>
  <text x="400" y="850" font-size="28" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" opacity="0.6">Garden Moments</text>
</svg>

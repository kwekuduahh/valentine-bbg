<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Scene: Growing Together — Two intertwined trees with shared roots and heart-shaped canopy -->
  <defs>
    <linearGradient id="dawn4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="50%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f7c5cc" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="sunGlow4" cx="0.5" cy="0.25" r="0.4">
      <stop offset="0%" stop-color="#ffd7cc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#dawn4)"/>
  <ellipse cx="400" cy="300" rx="300" ry="250" fill="url(#sunGlow4)"/>
  <!-- Ground -->
  <path d="M0 750 Q200 720 400 745 Q600 770 800 730 L800 1000 L0 1000Z" fill="#f4a6b1" opacity="0.15"/>
  <path d="M0 790 Q300 760 500 790 Q700 810 800 780 L800 1000 L0 1000Z" fill="#f7c5cc" opacity="0.2"/>
  <!-- Tree trunk - left, her tree -->
  <path d="M350 750 Q340 650 360 500 Q365 440 355 380" stroke="#9b1b30" stroke-width="16" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Tree trunk - right, his tree -->
  <path d="M450 750 Q460 650 440 500 Q435 440 445 380" stroke="#dc143c" stroke-width="14" fill="none" opacity="0.45" stroke-linecap="round"/>
  <!-- Intertwining middle section -->
  <path d="M360 500 Q380 460 440 480" stroke="#9b1b30" stroke-width="6" fill="none" opacity="0.35"/>
  <path d="M440 510 Q420 470 360 490" stroke="#dc143c" stroke-width="6" fill="none" opacity="0.3"/>
  <!-- Shared root system -->
  <path d="M350 750 Q300 780 250 770" stroke="#9b1b30" stroke-width="6" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M350 750 Q370 790 400 780" stroke="#9b1b30" stroke-width="5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M450 750 Q500 780 550 770" stroke="#dc143c" stroke-width="6" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M450 750 Q430 790 400 780" stroke="#dc143c" stroke-width="5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <!-- Heart-shaped canopy made of circles -->
  <circle cx="320" cy="320" r="65" fill="#dc143c" opacity="0.2"/>
  <circle cx="480" cy="320" r="65" fill="#dc143c" opacity="0.2"/>
  <path d="M260 340 Q400 540 540 340" fill="#dc143c" opacity="0.12"/>
  <!-- Leaves / smaller circles scattered in canopy -->
  <circle cx="340" cy="260" r="40" fill="#f7c5cc" opacity="0.4"/>
  <circle cx="460" cy="260" r="40" fill="#f4a6b1" opacity="0.35"/>
  <circle cx="400" cy="240" r="45" fill="#dc143c" opacity="0.15"/>
  <circle cx="290" cy="300" r="30" fill="#f7c5cc" opacity="0.3"/>
  <circle cx="510" cy="300" r="30" fill="#ffd7cc" opacity="0.35"/>
  <circle cx="370" cy="200" r="25" fill="#f4a6b1" opacity="0.25"/>
  <circle cx="430" cy="200" r="28" fill="#f7c5cc" opacity="0.3"/>
  <circle cx="400" cy="170" r="20" fill="#dc143c" opacity="0.18"/>
  <!-- Small heart at the very top -->
  <g transform="translate(400, 160) scale(0.5)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#dc143c" opacity="0.6"/>
  </g>
  <!-- Falling leaves -->
  <circle cx="260" cy="450" r="5" fill="#f7c5cc" opacity="0.4"/>
  <circle cx="540" cy="420" r="4" fill="#f4a6b1" opacity="0.35"/>
  <circle cx="320" cy="500" r="3" fill="#dc143c" opacity="0.3"/>
  <!-- Title card -->
  <rect x="150" y="830" width="500" height="120" rx="24" fill="#fff8f0" opacity="0.92"/>
  <text x="400" y="882" font-size="38" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" font-weight="600">Growing Together</text>
  <text x="400" y="922" font-size="22" fill="#5a4030" font-family="sans-serif" text-anchor="middle">Choosing each other, every day</text>
</svg>

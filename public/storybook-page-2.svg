<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Scene: First Long Conversation — Two phones connected by a flowing line of hearts, night sky -->
  <defs>
    <linearGradient id="night2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1717"/>
      <stop offset="50%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#5a4030"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.7" cy="0.15" r="0.3">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a1717" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#night2)"/>
  <ellipse cx="560" cy="120" rx="240" ry="200" fill="url(#moonGlow)"/>
  <!-- Moon -->
  <circle cx="600" cy="100" r="50" fill="#fff8f0" opacity="0.85"/>
  <circle cx="620" cy="88" r="42" fill="url(#night2)" opacity="0.85"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#f7c5cc" opacity="0.8"/>
  <circle cx="250" cy="140" r="1.5" fill="#fff8f0" opacity="0.7"/>
  <circle cx="340" cy="60" r="2" fill="#f7c5cc" opacity="0.6"/>
  <circle cx="450" cy="170" r="1.5" fill="#fff8f0" opacity="0.5"/>
  <circle cx="180" cy="200" r="1.8" fill="#f4a6b1" opacity="0.6"/>
  <circle cx="700" cy="250" r="2" fill="#f7c5cc" opacity="0.7"/>
  <circle cx="80" cy="310" r="1.5" fill="#fff8f0" opacity="0.5"/>
  <!-- Her phone/window - left side -->
  <rect x="60" y="400" width="280" height="380" rx="28" fill="#fff3e6" opacity="0.12"/>
  <rect x="80" y="420" width="240" height="340" rx="20" fill="#fff8f0" opacity="0.15"/>
  <!-- Glow from her screen -->
  <ellipse cx="200" cy="590" rx="120" ry="160" fill="#f7c5cc" opacity="0.08"/>
  <!-- Chat bubbles - her side -->
  <rect x="100" y="460" width="160" height="36" rx="18" fill="#f7c5cc" opacity="0.7"/>
  <rect x="120" y="510" width="130" height="36" rx="18" fill="#dc143c" opacity="0.5"/>
  <rect x="100" y="560" width="180" height="36" rx="18" fill="#f7c5cc" opacity="0.6"/>
  <!-- His phone/window - right side -->
  <rect x="460" y="400" width="280" height="380" rx="28" fill="#fff3e6" opacity="0.12"/>
  <rect x="480" y="420" width="240" height="340" rx="20" fill="#fff8f0" opacity="0.15"/>
  <!-- Chat bubbles - his side -->
  <rect x="520" y="470" width="150" height="36" rx="18" fill="#dc143c" opacity="0.5"/>
  <rect x="540" y="520" width="120" height="36" rx="18" fill="#f7c5cc" opacity="0.6"/>
  <rect x="510" y="570" width="170" height="36" rx="18" fill="#dc143c" opacity="0.4"/>
  <!-- Connecting line of hearts between phones -->
  <path d="M320 550 Q400 420 480 550" stroke="#dc143c" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 4"/>
  <g transform="translate(355, 470) scale(0.35)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#dc143c" opacity="0.7"/>
  </g>
  <g transform="translate(400, 445) scale(0.45)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#f7c5cc" opacity="0.8"/>
  </g>
  <g transform="translate(445, 470) scale(0.35)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#dc143c" opacity="0.7"/>
  </g>
  <!-- Clock indicating late night -->
  <text x="400" y="340" font-size="28" fill="#f7c5cc" font-family="sans-serif" text-anchor="middle" opacity="0.5">11:47 PM</text>
  <!-- Title card -->
  <rect x="150" y="830" width="500" height="120" rx="24" fill="#fff8f0" opacity="0.12"/>
  <text x="400" y="880" font-size="36" fill="#fff8f0" font-family="sans-serif" text-anchor="middle" font-weight="600" opacity="0.9">Midnight Conversations</text>
  <text x="400" y="920" font-size="20" fill="#f7c5cc" font-family="sans-serif" text-anchor="middle" opacity="0.7">Hours felt like minutes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- Moodboard: Beach Sunset  soft waves, warm sky -->
  <defs>
    <linearGradient id="mb1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7cc"/>
      <stop offset="50%" stop-color="#f7c5cc"/>
      <stop offset="100%" stop-color="#fff8f0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#mb1sky)"/>
  <!-- Sun -->
  <circle cx="400" cy="250" r="80" fill="#dc143c" opacity="0.2"/>
  <circle cx="400" cy="250" r="50" fill="#f4a6b1" opacity="0.3"/>
  <!-- Ocean waves -->
  <path d="M0 550 Q100 520 200 550 Q300 580 400 550 Q500 520 600 550 Q700 580 800 550 L800 900 L0 900Z" fill="#f7c5cc" opacity="0.35"/>
  <path d="M0 600 Q150 570 300 600 Q450 630 600 600 Q750 570 800 600 L800 900 L0 900Z" fill="#eab8b2" opacity="0.25"/>
  <!-- Beach -->
  <path d="M0 680 Q400 650 800 680 L800 900 L0 900Z" fill="#fff3e6" opacity="0.5"/>
  <!-- Two small silhouettes walking -->
  <circle cx="320" cy="650" r="8" fill="#9b1b30" opacity="0.4"/>
  <rect x="316" y="658" width="8" height="18" rx="3" fill="#9b1b30" opacity="0.35"/>
  <circle cx="345" cy="648" r="7" fill="#dc143c" opacity="0.4"/>
  <rect x="341" y="656" width="8" height="18" rx="3" fill="#dc143c" opacity="0.35"/>
  <!-- Footprints -->
  <ellipse cx="280" cy="670" rx="4" ry="2" fill="#9b1b30" opacity="0.15"/>
  <ellipse cx="260" cy="673" rx="4" ry="2" fill="#9b1b30" opacity="0.12"/>
  <text x="400" y="830" font-size="28" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" opacity="0.6">Beach Sunsets</text>
</svg>

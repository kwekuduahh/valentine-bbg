<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Scene: The First Date — Two figures at a cafe table with warm sunset tones -->
  <defs>
    <linearGradient id="sunset3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7cc"/>
      <stop offset="40%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fff3e6"/>
    </linearGradient>
    <radialGradient id="warmGlow3" cx="0.5" cy="0.6" r="0.35">
      <stop offset="0%" stop-color="#f7c5cc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sunset3)"/>
  <ellipse cx="400" cy="550" rx="300" ry="250" fill="url(#warmGlow3)"/>
  <!-- Window/arch in the background -->
  <path d="M200 200 Q200 80 400 80 Q600 80 600 200 L600 550 L200 550Z" fill="#fff8f0" opacity="0.5" stroke="#eab8b2" stroke-width="3"/>
  <!-- Sunset through window -->
  <circle cx="400" cy="250" r="70" fill="#dc143c" opacity="0.15"/>
  <circle cx="400" cy="250" r="45" fill="#f4a6b1" opacity="0.2"/>
  <!-- Cafe table -->
  <ellipse cx="400" cy="620" rx="200" ry="30" fill="#5a4030" opacity="0.2"/>
  <rect x="250" y="540" width="300" height="12" rx="6" fill="#3d2b1f" opacity="0.35"/>
  <rect x="380" y="552" width="8" height="80" fill="#3d2b1f" opacity="0.25"/>
  <!-- Coffee cups -->
  <ellipse cx="330" cy="520" rx="24" ry="8" fill="#fff8f0" stroke="#eab8b2" stroke-width="2"/>
  <rect x="308" y="500" width="44" height="22" rx="6" fill="#fff8f0" stroke="#eab8b2" stroke-width="2"/>
  <!-- Steam -->
  <path d="M325 495 Q320 480 328 470" stroke="#eab8b2" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M338 492 Q340 476 335 465" stroke="#eab8b2" stroke-width="1.5" fill="none" opacity="0.4"/>
  <ellipse cx="470" cy="520" rx="24" ry="8" fill="#fff8f0" stroke="#eab8b2" stroke-width="2"/>
  <rect x="448" y="500" width="44" height="22" rx="6" fill="#fff8f0" stroke="#eab8b2" stroke-width="2"/>
  <path d="M465 495 Q460 478 468 468" stroke="#eab8b2" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Her silhouette - seated left -->
  <g transform="translate(300, 360)">
    <ellipse cx="0" cy="0" rx="28" ry="34" fill="#9b1b30" opacity="0.6"/>
    <path d="M-22 28 Q-30 80 -26 130 L26 130 Q30 80 22 28Z" fill="#9b1b30" opacity="0.55"/>
    <path d="M-28 -15 Q-35 -35 -20 -42 Q5 -50 20 -42 Q35 -35 30 -10" fill="#5a4030" opacity="0.35"/>
  </g>
  <!-- His silhouette - seated right -->
  <g transform="translate(500, 355)">
    <ellipse cx="0" cy="0" rx="26" ry="32" fill="#dc143c" opacity="0.55"/>
    <path d="M-24 26 Q-28 78 -24 130 L24 130 Q28 78 24 26Z" fill="#dc143c" opacity="0.5"/>
  </g>
  <!-- Small flower/candle on table -->
  <rect x="395" y="510" width="10" height="28" rx="3" fill="#9b1b30" opacity="0.4"/>
  <circle cx="400" cy="505" r="10" fill="#dc143c" opacity="0.35"/>
  <circle cx="400" cy="500" r="4" fill="#f7c5cc" opacity="0.6"/>
  <!-- Decorative hearts floating above -->
  <g transform="translate(350, 280) scale(0.3)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#dc143c" opacity="0.35"/>
  </g>
  <g transform="translate(450, 260) scale(0.25)">
    <path d="M0 -15 C-20 -40 -48 -15 -28 8 L0 32 L28 8 C48 -15 20 -40 0 -15Z" fill="#f7c5cc" opacity="0.45"/>
  </g>
  <!-- Title card -->
  <rect x="150" y="730" width="500" height="130" rx="24" fill="#fff8f0" opacity="0.92"/>
  <text x="400" y="785" font-size="38" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" font-weight="600">The First Date</text>
  <text x="400" y="828" font-size="22" fill="#5a4030" font-family="sans-serif" text-anchor="middle">Laughter, shy glances, certainty</text>
</svg>

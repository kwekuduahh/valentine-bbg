<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Destination: Bali  tropical temple silhouette, palms -->
  <defs>
    <linearGradient id="d4bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7cc"/>
      <stop offset="60%" stop-color="#fff3e6"/>
      <stop offset="100%" stop-color="#fff8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="20" fill="url(#d4bg)"/>
  <!-- Sun -->
  <circle cx="200" cy="120" r="45" fill="#dc143c" opacity="0.15"/>
  <circle cx="200" cy="120" r="28" fill="#f4a6b1" opacity="0.2"/>
  <!-- Temple silhouette -->
  <path d="M200 180 L175 220 L160 220 L160 320 L240 320 L240 220 L225 220Z" fill="#9b1b30" opacity="0.2"/>
  <path d="M200 160 L185 180 L215 180Z" fill="#9b1b30" opacity="0.25"/>
  <path d="M200 145 L195 160 L205 160Z" fill="#dc143c" opacity="0.2"/>
  <!-- Temple steps -->
  <rect x="150" y="320" width="100" height="10" rx="2" fill="#9b1b30" opacity="0.15"/>
  <rect x="140" y="330" width="120" height="10" rx="2" fill="#9b1b30" opacity="0.12"/>
  <!-- Palm tree left -->
  <path d="M60 380 Q65 300 70 250" stroke="#5a4030" stroke-width="6" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M70 250 Q30 230 10 260" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.2"/>
  <path d="M70 250 Q50 210 30 220" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.18"/>
  <path d="M70 250 Q90 210 110 230" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.18"/>
  <!-- Palm tree right -->
  <path d="M340 380 Q335 310 330 260" stroke="#5a4030" stroke-width="6" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M330 260 Q360 230 380 250" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.18"/>
  <path d="M330 260 Q350 220 370 225" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.2"/>
  <path d="M330 260 Q310 220 290 235" stroke="#9b1b30" stroke-width="3" fill="none" opacity="0.18"/>
  <!-- Ground -->
  <path d="M0 380 Q200 360 400 380 L400 500 L0 500Z" fill="#f7c5cc" opacity="0.2"/>
  <text x="200" y="470" font-size="24" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" font-weight="600">Bali</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Scene: A Serendipitous Hello — Two silhouettes meeting under string lights -->
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="60%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fff3e6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#f7c5cc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky1)"/>
  <ellipse cx="400" cy="350" rx="320" ry="280" fill="url(#glow1)"/>
  <!-- Ground -->
  <path d="M0 750 Q200 700 400 740 Q600 780 800 730 L800 1000 L0 1000Z" fill="#f4a6b1" opacity="0.25"/>
  <path d="M0 780 Q150 760 350 790 Q550 820 800 770 L800 1000 L0 1000Z" fill="#f7c5cc" opacity="0.35"/>
  <!-- String lights -->
  <path d="M100 180 Q250 220 400 200 Q550 180 700 210" stroke="#eab8b2" stroke-width="2" fill="none"/>
  <circle cx="180" cy="200" r="8" fill="#dc143c" opacity="0.7"/>
  <circle cx="280" cy="210" r="6" fill="#f7c5cc" opacity="0.8"/>
  <circle cx="380" cy="198" r="8" fill="#dc143c" opacity="0.6"/>
  <circle cx="480" cy="204" r="7" fill="#f4a6b1" opacity="0.8"/>
  <circle cx="580" cy="196" r="6" fill="#dc143c" opacity="0.7"/>
  <circle cx="660" cy="208" r="8" fill="#f7c5cc" opacity="0.6"/>
  <!-- Her silhouette -->
  <g transform="translate(280, 350)">
    <ellipse cx="0" cy="-60" rx="32" ry="38" fill="#9b1b30" opacity="0.75"/>
    <path d="M-25 -25 Q-40 40 -35 120 Q-30 180 -10 220 L15 220 Q30 180 35 120 Q40 40 25 -25Z" fill="#9b1b30" opacity="0.7"/>
    <!-- Hair -->
    <path d="M-30 -80 Q-40 -100 -25 -105 Q0 -110 25 -105 Q40 -100 35 -75 Q38 -55 32 -40" fill="#5a4030" opacity="0.4"/>
  </g>
  <!-- His silhouette -->
  <g transform="translate(520, 340)">
    <ellipse cx="0" cy="-60" rx="30" ry="36" fill="#dc143c" opacity="0.65"/>
    <path d="M-28 -28 Q-38 40 -32 120 Q-28 180 -12 220 L12 220 Q28 180 32 120 Q38 40 28 -28Z" fill="#dc143c" opacity="0.6"/>
  </g>
  <!-- Small heart between them -->
  <g transform="translate(400, 380) scale(0.6)">
    <path d="M0 -20 C-25 -50 -60 -20 -35 10 L0 40 L35 10 C60 -20 25 -50 0 -20Z" fill="#dc143c" opacity="0.55"/>
  </g>
  <!-- Title card -->
  <rect x="150" y="680" width="500" height="130" rx="24" fill="#fff8f0" opacity="0.92"/>
  <text x="400" y="735" font-size="38" fill="#9b1b30" font-family="sans-serif" text-anchor="middle" font-weight="600">A Serendipitous Hello</text>
  <text x="400" y="780" font-size="22" fill="#5a4030" font-family="sans-serif" text-anchor="middle">Where the story began</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- His profile — strong masculine silhouette portrait with warm geometric accents -->
  <defs>
    <linearGradient id="hisBg" x1="0.7" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e6"/>
      <stop offset="100%" stop-color="#ffd7cc" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="hisGlow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="900" fill="url(#hisBg)"/>
  <ellipse cx="400" cy="380" rx="280" ry="260" fill="url(#hisGlow)"/>
  <!-- Geometric accent shapes (top-left) -->
  <rect x="80" y="70" width="80" height="80" rx="12" fill="#dc143c" opacity="0.08" transform="rotate(15 120 110)"/>
  <rect x="130" y="120" width="50" height="50" rx="8" fill="#9b1b30" opacity="0.1" transform="rotate(-10 155 145)"/>
  <!-- Geometric accent (bottom-right) -->
  <rect x="600" y="700" width="70" height="70" rx="10" fill="#dc143c" opacity="0.08" transform="rotate(20 635 735)"/>
  <rect x="650" y="740" width="45" height="45" rx="6" fill="#f4a6b1" opacity="0.12" transform="rotate(-15 672 762)"/>
  <!-- Portrait frame circle -->
  <circle cx="400" cy="360" r="225" fill="none" stroke="#eab8b2" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="360" r="215" fill="#fff8f0" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="400" cy="280" rx="64" ry="78" fill="#dc143c" opacity="0.5"/>
  <!-- Short hair -->
  <path d="M340 240 Q340 190 370 165 Q400 148 430 165 Q460 190 460 240" fill="#3d2b1f" opacity="0.4"/>
  <path d="M340 240 Q338 225 345 215" stroke="#3d2b1f" stroke-width="10" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M460 240 Q462 225 455 215" stroke="#3d2b1f" stroke-width="10" fill="none" opacity="0.3" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="380" y="350" width="40" height="42" rx="18" fill="#dc143c" opacity="0.4"/>
  <!-- Shoulders/body — broader -->
  <path d="M310 395 Q340 375 400 380 Q460 375 490 395 Q540 420 555 490 L245 490 Q260 420 310 395Z" fill="#dc143c" opacity="0.35"/>
  <!-- Collar detail -->
  <path d="M370 395 L400 420 L430 395" stroke="#fff8f0" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- Eyes (subtle) -->
  <ellipse cx="380" cy="272" rx="9" ry="4" fill="#3d2b1f" opacity="0.35"/>
  <ellipse cx="420" cy="272" rx="9" ry="4" fill="#3d2b1f" opacity="0.35"/>
  <!-- Subtle brow lines -->
  <path d="M368 260 Q380 256 392 260" stroke="#3d2b1f" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M408 260 Q420 256 432 260" stroke="#3d2b1f" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Smile -->
  <path d="M387 308 Q400 318 413 308" stroke="#3d2b1f" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Decorative dots -->
  <circle cx="270" cy="310" r="4" fill="#dc143c" opacity="0.3"/>
  <circle cx="530" cy="290" r="3" fill="#f7c5cc" opacity="0.4"/>
  <circle cx="310" cy="440" r="3" fill="#f4a6b1" opacity="0.35"/>
  <!-- Label -->
  <rect x="250" y="680" width="300" height="90" rx="20" fill="#fff8f0" opacity="0.85"/>
  <text x="400" y="720" font-size="32" fill="#dc143c" font-family="sans-serif" text-anchor="middle" font-weight="600">The Man</text>
  <text x="400" y="752" font-size="18" fill="#5a4030" font-family="sans-serif" text-anchor="middle">Steady, warm, faithful</text>
</svg>
